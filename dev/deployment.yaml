apiVersion: apps/v1
kind: Deployment
metadata:
  name: aks-demo-app-java
  namespace: dev
spec:
  replicas: 2
  selector:
    matchLabels:
      app: aks-demo-app-java
  template:
    metadata:
      labels:
        app: aks-demo-app-java
    spec:
      containers:
        - name: aks-demo-app-java
          image: varunaks1793257564.azurecr.io/aks-demo-app-java:5660323141137302271072aad03d74957722af5b
          imagePullPolicy: IfNotPresent
          ports:
            - containerPort: 8080
