apiVersion: apps/v1
kind: Deployment
metadata:
  name: aks-demo-app-java
  namespace: dev
spec:
  replicas: 2
  selector:
    matchLabels:
      app: aks-demo-app-java
  template:
    metadata:
      labels:
        app: aks-demo-app-java
    spec:
      serviceAccountName: s3-access-sa
      containers:
        - name: aks-demo-app-java
          image: 487043668737.dkr.ecr.ap-south-1.amazonaws.com/aks-demo-app-java:7c7eb93a79e5009603f7edd39b9fa5605033e862-41509116614-1
          imagePullPolicy: IfNotPresent
          ports:
            - containerPort: 8080
          volumeMounts:
            - name: s3-storage
              mountPath: /mnt/s3
      volumes:
        - name: s3-storage
          persistentVolumeClaim:
            claimName: s3-pvc