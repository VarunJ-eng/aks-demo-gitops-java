apiVersion: apps/v1
kind: Deployment
metadata:
  name: aks-demo-app
  namespace: dev
spec:
  replicas: 2
  selector:
    matchLabels:
      app: aks-demo-app
  template:
    metadata:
      labels:
        app: aks-demo-app
    spec:
      containers:
        - name: aks-demo-app
          image: varunaks1793257564.azurecr.io/aks-demo-app-java:bfa71c05073c3b4c1939c34e05d2b89821ac70282a9c1c6d263babd3f2c5fac4
          imagePullPolicy: IfNotPresent
          ports:
            - containerPort: 8080